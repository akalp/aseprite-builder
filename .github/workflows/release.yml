name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin/amd64 is cross-built from the arm64 runner (pure Go,
          # CGO disabled); the other targets build on their own OS.
          - runner: macos-latest
            goos: darwin
          - runner: windows-latest
            goos: windows
          - runner: ubuntu-latest
            goos: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and pack the spec §3 artifact(s)
        run: go run ./cmd/release -os ${{ matrix.goos }} -dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Re-run the §38 release-safety checker over the merged artifacts
        run: go run ./cmd/releasecheck dist/*
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # Hyphenated tags (v0.1.0-rc.1, -beta…) publish as prereleases.
          prerelease=0
          case "$tag" in *-*) prerelease=1 ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif [ "$prerelease" = 1 ]; then
            gh release create "$tag" dist/* --title "$tag" --generate-notes --prerelease
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
